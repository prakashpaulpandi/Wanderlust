<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#161d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e8860c"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Glow effect -->
  <circle cx="600" cy="200" r="350" fill="#f5a623" opacity="0.08"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="72" fill="#080c14" opacity="0.9"/>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Logo -->
  <path d="M 60 36 L 75 24 L 80 30 L 72 36 L 78 44 L 72 48 Z" fill="url(#accent)"/>
  <text x="90" y="44" font-family="Inter, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">Wanderlust</text>

  <!-- Nav Links -->
  <text x="850" y="44" font-family="Inter, sans-serif" font-size="14" fill="#f5a623" font-weight="600">Home</text>
  <text x="920" y="44" font-family="Inter, sans-serif" font-size="14" fill="#8892a4">Destinations</text>
  
  <!-- My Trips Badge -->
  <rect x="1030" y="24" width="110" height="32" rx="16" fill="rgba(245,166,35,0.15)" stroke="rgba(245,166,35,0.3)"/>
  <text x="1045" y="45" font-family="Inter, sans-serif" font-size="13" fill="#f5a623" font-weight="600">My Trips (2)</text>

  <!-- Hero Content -->
  <text x="100" y="190" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f5a623" letter-spacing="3">✦ AI-POWERED TRAVEL EXPLORER</text>
  
  <text x="100" y="260" font-family="Playfair Display, Georgia, serif" font-size="52" font-weight="900" fill="#ffffff">Discover the World,</text>
  <text x="100" y="320" font-family="Playfair Display, Georgia, serif" font-size="52" font-weight="900" fill="url(#accent)">Your Way.</text>
  
  <text x="100" y="375" font-family="Inter, sans-serif" font-size="16" fill="#8892a4" width="500">
    Explore 20 curated world destinations, check real-time weather, discover iconic
  </text>
  <text x="100" y="400" font-family="Inter, sans-serif" font-size="16" fill="#8892a4">
    landmarks with live photos, and plan your trip with AI assistance.
  </text>

  <!-- CTA Button -->
  <rect x="100" y="445" width="220" height="52" rx="10" fill="url(#accent)"/>
  <text x="135" y="477" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Explore Destinations →</text>

  <!-- Stats Grid -->
  <g transform="translate(100, 540)">
    <text x="0" y="30" font-family="Inter, sans-serif" font-size="32" font-weight="900" fill="#ffffff">20+</text>
    <text x="0" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#8892a4" letter-spacing="1">DESTINATIONS</text>

    <text x="140" y="30" font-family="Inter, sans-serif" font-size="32" font-weight="900" fill="#ffffff">Live</text>
    <text x="140" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#8892a4" letter-spacing="1">OPENWEATHER</text>

    <text x="270" y="30" font-family="Inter, sans-serif" font-size="32" font-weight="900" fill="#ffffff">AI</text>
    <text x="270" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#8892a4" letter-spacing="1">TRIP PLANNER</text>
  </g>

  <!-- Right Side Mockup Card -->
  <rect x="680" y="150" width="440" height="440" rx="20" fill="url(#cardBg)" stroke="rgba(245,166,35,0.2)" stroke-width="1.5"/>
  <rect x="700" y="170" width="400" height="200" rx="12" fill="#161d2e"/>
  
  <text x="720" y="405" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Santorini, Greece</text>
  <text x="720" y="430" font-family="Inter, sans-serif" font-size="13" fill="#8892a4">Jewel of the Aegean • 6 Places to Visit</text>
  
  <rect x="720" y="450" width="80" height="24" rx="12" fill="rgba(245,166,35,0.15)"/>
  <text x="735" y="466" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#f5a623">ROMANTIC</text>
  
  <rect x="810" y="450" width="60" height="24" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="825" y="466" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#8892a4">BEACH</text>

  <rect x="720" y="500" width="360" height="44" rx="8" fill="url(#accent)"/>
  <text x="815" y="527" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">View Destination Plan →</text>
</svg>
